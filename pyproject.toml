[project]
name = "helmsmate"
version = "0.1.0"
description = "YAML decks compiled to self-contained HTML presentations — with an API and MCP surface so LLMs can build them."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.scripts]
helmsmate = "helmsmate.cli:main"
helmsmate-api = "helmsmate.api:main"
helmsmate-mcp = "helmsmate.mcp:stdio_main"

[dependency-groups]
dev = ["playwright>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["helmsmate"]

# Ship the template, themes and built-in assets inside the package so an
# installed HelmsMate can still render a deck.
[tool.hatch.build.targets.wheel.force-include]
"engine/template.html" = "helmsmate/_data/template.html"
"themes" = "helmsmate/_data/themes"
"assets/sef-corona.svg" = "helmsmate/_data/assets/sef-corona.svg"
"assets/icons" = "helmsmate/_data/assets/icons"

[tool.hatch.build.targets.sdist]
include = [
  "helmsmate",
  "engine",
  "themes",
  "scripts",
  "tests",
  "deck.example.yaml",
  "README.md",
  # the wheel force-includes these — they must be in the sdist too, or a
  # wheel cannot be built from it
  "assets/sef-corona.svg",
  "assets/icons",
]
