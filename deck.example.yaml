  # ════════════════════════ 5 · MULTIMODAL ════════════════════════
  - layout: cards3
    context: Feature 02 · Multimodal Notes
    eyebrow: 02 · AI at the learner’s service
    title: |
      Every learner, a different temperament.
      Every learner, notes in their own mode.
    cards:
      - k: PDF Study Notes
        h: For the visual reader
        p: >-
          Structured, lecture-accurate notes rendered from your released
          courseware. Clean Tufte-aware layout, plotted for re-reading.
      - k: Generated Podcasts
        h: For the auditory learner
        p: >-
          Scripted by AI, voiced to audio, grounded in the same courseware
          as the PDF. Listen on the bus, before the exam, on repeat.
      - k: Customised to You
        h: For the way you think
        p: >-
          Slower or faster, analogy-first or definition-first, math-heavy or
          narrative — the notes adapt to your temperament, not the other way round.
    lede_after: >-
      This is multimodal AI doing real work — not one-size-fits-all
      chat transcripts, but a course that renders itself into the shape
      each learner needs.
    foot: Multi-modal AI, in service of one learner

  # ════════════════════════ 6 · SOCRATIC TRIDENT ════════════════════════
  - layout: cards3
    context: Feature 03 · The Socratic Trident
    eyebrow: 03 · Three domains, not one generalist
    title: |
      One chatbot can only do an average job.
      We give you three — each with a domain.
    cards:
      - k: ◦ Socrates my Friend
        h: Course operations
        p: >-
          Fees, calendars, deadlines, university offices, policies —
          the business of study, kept warm and precise.
      - k: ◦ Socrates my Philosopher
        h: Ideas & the wider world
        p: >-
          Connects released concepts beyond the syllabus — every claim
          marked [course] or [web], every answer a new trailhead.
      - k: ◦ Socrates my Guide
        h: Courseware, directly
        p: >-
          Answers strictly from your unlocked lessons. RAG-grounded,
          provenance-tagged, hallucination-resistant.
    lede_after: >-
      24/7, all three. Each with a focused domain — together far more
      capable than a single generalist agent, because the boundaries between
      course ops, ideas, and courseware are real and worth honouring.
    foot: Friend · Philosopher · Guide

  # ════════════════════════ 7 · THE STACK ════════════════════════
  - layout: cards2
    context: How it’s built
    eyebrow: Production-grade, end-to-end
    title: |
      Simple architecture. Real engineering.
      No demo tricks.
    cards:
      - k: The pipeline
        h: Courseware → Second Brain → Artifacts
        p: >-
          Real B.Sc courseware (Christ University, Bangalore) is chunked,
          embedded, and grounded in Firestore vector search. GenKit
          orchestrates four production flows: **guide-chat**,
          **socratic-tutor**, **multi-format**, **ingestion**. Gemini 3.7
          Flash is the primary LLM with a Sarvam fallback. Cloud Run hosts
          the service; Secret Manager locks the keys.
      - k: The hardening
        h: What separates product from prototype
        p: >-
          Generation-aware circuit breaker, idempotent retries with
          deterministic document IDs, structured error classification,
          250 tests passing, accessibility (WCAG) built in from Phase 9,
          RAG validated at scale after a real retrieval failure at 219+
          lessons.
    stats:
      - big: Next 14
        small: the stack · Bun + TypeScript + Tailwind
      - big: GCP
        small: Cloud Run · Firestore · GCS · Vertex AI
      - big: "250"
        small: tests green · routing · retrieval · retries
    foot: Underpinned by real engineering discipline

  # ════════════════════════ 8 · CLOSER ════════════════════════
  - layout: closer
    context: The invitation
    eyebrow: The vision, stated plainly
    title: |
      Every learner is different.
      The system should be, too.
    lede: >-
      St. Elmo’s fire appears at the masthead when sailors have weathered
      the worst of the storm — a quiet blue light that says the way
      is navigable. Saint Elms Fire is the same signal for the learner.
      A second brain growing for you. Notes in the shape you think in.
      A Friend, a Philosopher, and a Guide beside you, day and night.
    lede2: >-
      This is learner-first education, built deliberately —
      and in the open. Code and courseware at
      **github.com/thecont1/saint-elms-fire**.
    foot: Saint Elms Fire · Guidance through the storm
