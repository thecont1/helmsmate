# ──────────────────────────────────────────────────────────────────────────────
# HelmChart example deck — the Saint Elms Fire intro, ported 1:1 from the
# hand-built index.html. Every editorial string lives here; the engine owns
# layout, theming, navigation and the invariant guards.
#
# Conventions:
#   title / note / stat.small : newlines render as <br>   (you own the breaks)
#   lede / lede_after / card body: newlines are collapsed (natural flow)
#   **text** renders <b>text</b> in any prose field
#   figure accepts a raw SVG block, passed through untouched
# ──────────────────────────────────────────────────────────────────────────────

deck:
  title: "Saint Elms Fire — Intent · Vision · The Learner First"
  brand:
    mark: assets/sef-corona.svg          # inlined at build; favicon data-URI too
    word: "Saint **Elms** Fire"          # **bold** segment supported
    alt: "Saint Elms Fire CoronaMark"
    reset_on_click: true                  # clicking the mark returns to slide 1

theme: mariners-chart

slides:

  # ════════════════════════ 1 · OPENER ════════════════════════
  - layout: opener
    context: Intent · Purpose · Vision
    eyebrow: An AI-native LMS
    title: |
      Guidance through
      the storm.
    lede: >-
      Most learning platforms are digital filing cabinets — they store, track,
      and file. Saint Elms Fire puts learning back at the masthead, built with
      the **learner** as the primary user. Every learner is different; this
      is the core idea the whole system is designed around.
    stats:
      - big: "3"
        small: "Focus areas: Friend, Philosopher, Guide"
      - big: Day 1
        small: Your second brain starts building
      - big: "∞"
        small: Multimodal AI at the learner’s service
    foot: St. Elmo’s fire · the blue-white corona at the masthead

  # ════════════════════════ 2 · THE DIAGNOSIS ════════════════════════
  - layout: cards2
    context: Why we built it
    eyebrow: The diagnosis
    title: |
      Most LMSs are designed for Management.
      Learning deserves its own architect.
    cards:
      - k: The incumbent
        h: Designed for administrators
        p: >-
          Proctored rows, attendance matrices, gradebooks, RBAC, course
          assignment. The learner is a passive row in someone else’s
          dashboard. Content is warehoused, not taught.
      - k: The correction
        h: Designed for the learner
        p: >-
          Elms inverts the hierarchy. The primary user is the student; every
          management feature falls out of serving them. The interface speaks
          the mariner’s tongue — a chart, a compass, a beacon — not a
          spreadsheet.
    note: |
      Every learner is different.
      Temperament, pace, modality, prior knowledge — the system starts there.
    foot: The learner is the primary user

  # ════════════════════════ 3 · VISION PILLARS ════════════════════════
  - layout: cards3
    context: Three vital features
    eyebrow: The vision
    title: |
      What good is AI if it cannot take on
      100× the work a human can?
    cards:
      - k: 01 · The Second Brain
        h: A personal Karpathy-style wiki
        p: >-
          Built from Day 1 and grown day-over-day to match and support each
          learner to the end of their course.
      - k: 02 · Multimodal AI
        h: Notes that fit the temperament
        p: >-
          Custom course notes generated per learner — PDF, podcast,
          and whatever format meets them where they are.
      - k: 03 · The Socratic Trident
        h: Three chatbots, three focused domains
        p: >-
          Friend, Philosopher, Guide — 24/7 companions that answer,
          challenge, and push the learner further than one generalist bot can.
    lede_after: >-
      These are not features bolted on. They are the load-bearing design
      decisions that follow from taking the learner seriously.
    foot: AI that takes on 100× the work

