<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{DECK_TITLE}}</title>
  <link rel="icon" type="image/svg+xml" href="{{FAVICON}}" />
  <style>
    :root {
      {{THEME_VARS}}

      /* Hard-wired invariant guard values. These are intentionally explicit.
         If a future theme omits them, the deck still renders. */
      --_paper: #FBFBFD;
      --_chart: #F5F7FB;
      --_beacon-700: #3452AE;
      --_beacon-800: #2A4190;
      --_beacon-500: #4A68C8;
      --_beacon-600: #3E5EC0;
      --_beacon-900: #1F2F66;
      --_marine-700: #2C4A80;
      --_marine-800: #243C6B;
      --_marine-900: #1D2F56;
      --_marine-950: #16223F;
      --_font-display: "Iowan Old Style","Big Caslon",Georgia,"Times New Roman",serif;
      --_font-sans: "Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;
      --_font-mono: Menlo,"SF Mono",Monaco,Consolas,monospace;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; height: 100%; }

    body {
      font-family: var(--font-sans, var(--_font-sans));
      background: var(--chart, var(--_chart));
      color: var(--marine-900, var(--_marine-900));
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 70% 30%, var(--grid-glow, rgba(62,94,200,.10)), transparent 45%),
        repeating-linear-gradient(0deg, transparent, transparent calc(var(--grid-size, 56px) - 1px), var(--grid-line-y, rgba(62,94,200,.045)) var(--grid-size, 56px)),
        repeating-linear-gradient(90deg, transparent, transparent calc(var(--grid-size, 56px) - 1px), var(--grid-line-x, rgba(62,94,200,.05)) var(--grid-size, 56px));
    }

    .deck {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 1;
      display: flex;
      flex-direction: column;
    }

    .deck-head {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      padding: 28px 48px 0;
      pointer-events: none;
    }

    .head-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--marine-700, var(--_marine-700));
      padding-bottom: 18px;
      pointer-events: auto;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .brand-mark { display: block; width: 44px; height: 44px; }
    .brand-mark svg { display: block; width: 100%; height: 100%; }
    .brand-word { font-family: var(--font-display, var(--_font-display)); font-size: 22px; color: var(--marine-950, var(--_marine-950)); letter-spacing: -0.02em; }
    .brand-word b { font-weight: 700; color: var(--beacon-800, var(--_beacon-800)); }

    .context-label { font-family: var(--font-mono, var(--_font-mono)); font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--beacon-700, var(--_beacon-700)); }

    .track {
      display: flex;
      height: 100%;
      transition: transform .55s cubic-bezier(.4,0,.2,1);
      will-change: transform;
    }

    .slide {
      width: 100vw;
      height: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 120px 48px 88px;
      position: relative;
      overflow: hidden;
    }

    .stage {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stage-foot {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 48px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono, var(--_font-mono));
      font-size: 11px;
      color: var(--beacon-700, var(--_beacon-700));
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .nav {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: rgba(251,251,253,.92);
      border: 1px solid var(--beacon-200, #C9D6EF);
      border-radius: 999px;
      padding: 6px 16px;
      box-shadow: 0 1px 3px rgba(22,34,63,.12);
    }

    .nav button {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 50%;
      background: var(--paper, var(--_paper));
      color: var(--beacon-800, var(--_beacon-800));
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, color .15s;
    }

    .nav button:hover { background: var(--beacon-100, #E4EAF7); color: var(--beacon-900, var(--_beacon-900)); }
    .nav button:disabled { opacity: .4; cursor: not-allowed; }

    .count { min-width: 40px; text-align: center; font-size: 12px; font-weight: 600; color: var(--marine-900, var(--_marine-900)); letter-spacing: 0.04em; }

    .eyebrow {
      font-family: var(--font-mono, var(--_font-mono));
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: var(--beacon-700, var(--_beacon-700));
      margin: 0 0 14px;
    }

    h2 {
      font-family: var(--font-display, var(--_font-display));
      font-size: clamp(36px, 4.2vw, 62px);
      line-height: 1.08;
      color: var(--marine-950, var(--_marine-950));
      margin: 0 0 22px;
    }

    .lede, .lede2, .slide p {
      font-size: clamp(16px, 1.45vw, 20px);
      line-height: 1.55;
      color: var(--marine-800, var(--_marine-800));
      max-width: 62ch;
    }

    .lede b, .lede2 b, .slide p b { color: var(--beacon-800, var(--_beacon-800)); font-weight: 600; }

    .note {
      margin-top: 28px;
      font-family: var(--font-mono, var(--_font-mono));
      font-size: 12px;
      line-height: 1.7;
      color: var(--beacon-700, var(--_beacon-700));
      border-left: 2px solid var(--beacon-400, #6E8BD9);
      padding-left: 16px;
    }

    .grid2, .grid3 {
      display: grid;
      gap: 24px;
      width: 100%;
      margin-top: 18px;
    }
    .grid2 { grid-template-columns: repeat(2, 1fr); }
    .grid3 { grid-template-columns: repeat(3, 1fr); }

    .card {
      background: var(--paper, var(--_paper));
      border: 1px solid var(--beacon-200, #C9D6EF);
      border-radius: 16px;
      padding: 26px 28px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 1px 2px rgba(22,34,63,.05);
    }

    .card .k {
      font-family: var(--font-mono, var(--_font-mono));
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--beacon-600, var(--_beacon-600));
      margin-bottom: 8px;
    }

    .card h3 {
      font-family: var(--font-display, var(--_font-display));
      font-size: clamp(22px, 1.9vw, 30px);
      line-height: 1.15;
      color: var(--marine-900, var(--_marine-900));
      margin: 0 0 12px;
    }

    .card p { font-size: clamp(14px, 1.15vw, 17px); line-height: 1.55; color: var(--marine-700, var(--_marine-700)); margin: 0; }
    .card p b { color: var(--beacon-800, var(--_beacon-800)); font-weight: 600; }

    .statline {
      display: flex;
      gap: 40px;
      margin-top: 34px;
    }

    .stat { text-align: left; }
    .stat .big {
      font-family: var(--font-display, var(--_font-display));
      font-size: clamp(44px, 4.4vw, 76px);
      color: var(--beacon-800, var(--_beacon-800));
      line-height: 1;
    }
    .stat .small {
      font-family: var(--font-mono, var(--_font-mono));
      font-size: 11px;
      line-height: 1.45;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--marine-700, var(--_marine-700));
      margin-top: 8px;
    }

    .figure2-stage {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
      align-items: center;
      width: 100%;
    }

    .figure-wrap { display: flex; justify-content: center; align-items: center; }
    .figure-wrap svg { max-width: 100%; height: auto; }

    .closer { text-align: center; align-items: center; }
    .closer .stage { align-items: center; }
    .closer h2 { text-align: center; }
    .closer .lede, .closer .lede2 { max-width: 58ch; text-align: center; }

    .github-link {
      display: inline-block;
      margin-top: 6px;
      font-family: var(--font-mono, var(--_font-mono));
      font-size: 12px;
      color: var(--beacon-700, var(--_beacon-700));
      text-decoration: none;
      border-bottom: 1px solid var(--beacon-400, #6E8BD9);
    }
    .github-link:hover { color: var(--beacon-900, var(--_beacon-900)); border-color: var(--beacon-700, var(--_beacon-700)); }

    @media (max-width: 980px) {
      .deck-head { padding: 20px 28px 0; }
      .slide { padding: 96px 28px 84px; overflow-y: auto; }
      .grid2 { grid-template-columns: 1fr; }
      .grid3 { grid-template-columns: 1fr; }
      .figure2-stage { grid-template-columns: 1fr; }
      .statline { flex-wrap: wrap; gap: 24px; }
      .stage-foot { padding: 18px 28px 22px; }
    }

    @media (max-width: 640px) {
      .brand-word { display: none; }
      .context-label { font-size: 10px; }
      .slide { padding: 92px 22px 80px; }
    }
  </style>
</head>
<body>
  <header class="deck-head" aria-label="Deck header">
    <div class="head-inner">
      <a class="brand" id="brand" href="#/1" aria-label="{{BRAND_ALT}}">
        <span class="brand-mark">{{LOGO_SVG}}</span>
        <span class="brand-word">{{BRAND_WORD}}</span>
      </a>
      <span class="context-label" id="context-label" aria-live="polite">{{FIRST_CONTEXT}}</span>
    </div>
  </header>

  <main class="deck" role="main" aria-roledescription="carousel">
    <div class="track" id="track" role="list">
      {{SLIDES}}
    </div>
  </main>

  <script>
    (function() {
      const track = document.getElementById('track');
      const brand = document.getElementById('brand');
      const context = document.getElementById('context-label');
      const total = {{SLIDE_COUNT}};
      let current = 1;

      function setCounter() {
        document.querySelectorAll('.count').forEach(function(el) {
          el.textContent = current + ' / ' + total;
        });
        document.querySelectorAll('.nav button.prev').forEach(function(b) { b.disabled = current === 1; });
        document.querySelectorAll('.nav button.next').forEach(function(b) { b.disabled = current === total; });
      }

      function updateHeader() {
        const active = track.children[current - 1];
        if (active && active.dataset.context) context.textContent = active.dataset.context;
      }

      function go(n, push) {
        if (n < 1 || n > total) return;
        current = n;
        track.style.transform = 'translateX(' + (-(current - 1) * 100) + 'vw)';
        updateHeader();
        setCounter();
        if (push !== false && history.replaceState) {
          history.replaceState(null, '', '#/' + current);
        }
      }

      function hashSlide() {
        const m = location.hash.match(/^#\/(\d+)$/);
        return m ? parseInt(m[1], 10) : 1;
      }

      document.querySelectorAll('.nav button.prev').forEach(function(b) { b.addEventListener('click', function() { go(current - 1); }); });
      document.querySelectorAll('.nav button.next').forEach(function(b) { b.addEventListener('click', function() { go(current + 1); }); });

      brand.addEventListener('click', function(e) {
        e.preventDefault();
        go(1);
      });

      window.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') go(current - 1);
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          go(current + 1);
        }
      });

      window.addEventListener('hashchange', function() { go(hashSlide(), false); });

      go(hashSlide(), false);
    })();
  </script>
</body>
</html>
