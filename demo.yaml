# helmsmate demo page — single-slide deck for /demo/.
# Same header/footer chrome as the main deck, but the centre holds a video
# player. Drop your helmsmate-demo.mp4 alongside this page (e.g.
# /demo/helmsmate-demo.mp4) and the <video> element below will pick it up.

deck:
  title: "HelmsMate demo"
  brand:
    word: "Helms**Mate**"
    alt: "HelmsMate"
  footer:
    default: "HelmsMate · decks compiled from YAML"

theme: archive-trace

slides:

  # ════════════════════════ DEMO VIDEO ════════════════════════
  - layout: demo
    context: Demonstration
    eyebrow: A working demonstration
    title: See a deck being built.
    figure: |
      <video controls preload="metadata" playsinline
             poster="helmsmate-demo-poster.jpg">
        <source src="helmsmate-demo.mp4" type="video/mp4">
        Your browser doesn't support embedded video.
        <a href="helmsmate-demo.mp4">Download the demo MP4</a>.
      </video>
    lede: >-
      A short walkthrough of the authoring loop — read the schema, write the
      deck, build it, then open the single file that comes out the other end.
    lede2: >-
      90 seconds · no narration · click the play button.
    foot: Demo video · drop helmsmate-demo.mp4 next to this page
