<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="robby &amp; troid — orio cookie mark">
  <!--
    robby & troid — orio mark, retinted to the robby palette.
    A two-tone coin: obverse (cream, left) and reverse (ink, right), split
    by a hairline vermilion spine. Two small dots face each other across
    the spine — the obverse and reverse, mutually exclusive to sight.
    Palette: Registration Vermilion #e3442f · archive paper #f4efe1 ·
    charcoal ink #1c1a19.
  -->
  <circle cx="32" cy="32" r="28.5" fill="#e3442f"/>
  <!-- left half = obverse (archive paper) -->
  <path d="M 32 3.5 A 28.5 28.5 0 0 0 32 60.5 Z" fill="#f4efe1"/>
  <!-- spine — vermilion hairline so the two halves read as one object -->
  <line x1="32" y1="3.5" x2="32" y2="60.5" stroke="#1c1a19" stroke-width="0.8" opacity="0.55"/>
  <!-- two facing centre marks -->
  <circle cx="26" cy="32" r="2.6" fill="#1c1a19"/>
  <circle cx="38" cy="32" r="2.6" fill="#f4efe1"/>
  <!-- thin outer ring echoing the corona -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#f4efe1" stroke-width="1.2" opacity="0.55"/>
</svg>
