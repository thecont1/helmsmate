<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Saint Elms Fire — CoronaMark">
  <!--
    Official Saint Elms Fire CoronaMark, rebuilt from src/components/Navigation.tsx
    (the corona spark: St. Elmo's fire radiating at the masthead).
    Exact geometry scaled ×(8/3) from the 24×24 viewBox onto a 64×64 badge disc.
    beacon-600 disc · paper-white corona · 4 long rays (N/E/S/W) + 4 short rays (diagonals).
  -->
  <circle cx="32" cy="32" r="28.5" fill="#3E5EC0"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="#F6F7FB" stroke-width="1.2" opacity="0.45"/>
  <g transform="translate(32,32)">
    <circle r="5.4" fill="#F6F7FB"/>
    <!-- 8 rays: even = long (strokeWidth 2), odd = short (1.4) — matches CoronaMark -->
    <g stroke="#F6F7FB" stroke-linecap="round">
      <line x1="9.1"  y1="0"     x2="17.9"  y2="0"      stroke-width="3.4"/>
      <line x1="6.4"  y1="6.4"   x2="12.25" y2="12.25"  stroke-width="2.4"/>
      <line x1="0"    y1="9.1"   x2="0"     y2="17.9"   stroke-width="3.4"/>
      <line x1="-6.4" y1="6.4"   x2="-12.25" y2="12.25" stroke-width="2.4"/>
      <line x1="-9.1" y1="0"     x2="-17.9" y2="0"      stroke-width="3.4"/>
      <line x1="-6.4" y1="-6.4"  x2="-12.25" y2="-12.25" stroke-width="2.4"/>
      <line x1="0"    y1="-9.1"  x2="0"     y2="-17.9"  stroke-width="3.4"/>
      <line x1="6.4"  y1="-6.4"  x2="12.25" y2="-12.25" stroke-width="2.4"/>
    </g>
  </g>
</svg>
